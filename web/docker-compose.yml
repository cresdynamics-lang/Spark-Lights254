services:
  db:
    image: postgres:16-alpine
    container_name: sparklights-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: sparklights
      POSTGRES_PASSWORD: sparklights
      POSTGRES_DB: sparklights
    volumes:
      - sparklights_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparklights -d sparklights"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sparklights_pg:
